name: Unpack Manufacturing30 industrial source (one-time)
on:
  push:
    branches: [main]
    paths:
      - 'docs/manufacturing30/src/industrial.mjs.xz'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore readable Three.js machinery source
        run: |
          xz -dc docs/manufacturing30/src/industrial.mjs.xz > docs/manufacturing30/src/industrial.mjs
          node --check docs/manufacturing30/src/industrial.mjs
          test "$(wc -c < docs/manufacturing30/src/industrial.mjs)" -gt 30000
          git add docs/manufacturing30/src/industrial.mjs
          git rm docs/manufacturing30/src/industrial.mjs.xz
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add original detailed industrial machinery assemblies for all 30 chapters'
          git push origin HEAD:main
