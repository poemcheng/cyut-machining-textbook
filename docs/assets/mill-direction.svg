<path d="M259 227 A110 110 0 0 1 424 322" fill="none" stroke="#087f8c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon data-role="arrowhead" points="424.000,322.000 406.000,286.000 442.000,286.000" fill="#087f8c" stroke="none"/>
<rect x="125" y="429" width="380" height="74" rx="0" fill="#dbe3e9" stroke="#163249" stroke-width="3"/>
<circle cx="315" cy="429" r="7" fill="#ed8b3a" stroke="#ed8b3a" stroke-width="3"/>
