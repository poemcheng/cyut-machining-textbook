<polygon data-role="arrowhead" points="979.000,322.000 961.000,286.000 997.000,286.000" fill="#087f8c" stroke="none"/>
<rect x="680" y="429" width="380" height="74" rx="0" fill="#dbe3e9" stroke="#163249" stroke-width="3"/>
<circle cx="870" cy="429" r="7" fill="#ed8b3a" stroke="#ed8b3a" stroke-width="3"/>
<line x1="957" y1="413" x2="787" y2="413" stroke="#ed8b3a" stroke-width="4"/>
<polygon data-role="arrowhead" points="787.000,413.000 823.000,395.000 823.000,431.000" fill="#ed8b3a" stroke="none"/>
<text x="870" y="380" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">接觸處刀刃速度 ←</text>
<line x1="1005" y1="548" x2="735" y2="548" stroke="#087f8c" stroke-width="5"/>
<polygon data-role="arrowhead" points="735.000,548.000 780.000,525.500 780.000,570.500" fill="#087f8c" stroke="none"/>
<text x="870" y="584" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">工作台進給 ←（相同）</text>
<text x="870" y="206" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">切屑厚度：厚 → 薄</text>
<line x1="590" y1="140" x2="590" y2="590" stroke="#dbe3e9" stroke-width="2"/>
<rect x="40" y="595" width="1120" height="68" rx="12" fill="#e9f4f5" stroke="none" stroke-width="3"/>
<text x="60" y="622" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">有背隙的傳統手動銑床，順銑可能拉動工作台突然前衝；初學依教師指定採逆銑。</text>
<text x="60" y="653" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">旋轉反向或改在刀具另一側切削時，必須重新比較接觸點方向，不能只看左右箭頭。</text>
</svg>
