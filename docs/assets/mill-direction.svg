<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">順銑與逆銑：比較接觸處切向速度與工作台進給</title><desc id="desc">俯視示意：兩圖刀具皆順時針旋轉；橘點是用來比較方向的接觸位置。</desc>
<rect width="1200" height="700" fill="white"/>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}</style>
<text x="40" y="49" font-size="34" fill="#163249" text-anchor="start" font-weight="bold">順銑與逆銑：比較接觸處切向速度與工作台進給</text>
<text x="40" y="86" font-size="24" fill="#61788a" text-anchor="start" font-weight="normal">俯視示意：兩圖刀具皆順時針旋轉；橘點是用來比較方向的接觸位置。</text>
