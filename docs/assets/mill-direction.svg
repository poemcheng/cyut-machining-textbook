<polygon data-role="arrowhead" points="232.000,413.000 268.000,395.000 268.000,431.000" fill="#ed8b3a" stroke="none"/>
<text x="315" y="380" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">接觸處刀刃速度 ←</text>
<line x1="180" y1="548" x2="450" y2="548" stroke="#087f8c" stroke-width="5"/>
<polygon data-role="arrowhead" points="450.000,548.000 405.000,570.500 405.000,525.500" fill="#087f8c" stroke="none"/>
<text x="315" y="584" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">工作台進給 →（相反）</text>
<text x="315" y="206" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">切屑厚度：薄 → 厚</text>
<text x="870" y="162" font-size="32" fill="#163249" text-anchor="middle" font-weight="bold">順銑</text>
<circle cx="870" cy="322" r="107" fill="#e9f4f5" stroke="#163249" stroke-width="3"/>
