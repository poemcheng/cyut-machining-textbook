<text x="729" y="501" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">停機以頂尖／量規校正</text>
<rect x="40" y="595" width="1120" height="68" rx="12" fill="#e9f4f5" stroke="none" stroke-width="3"/>
<text x="60" y="622" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">工件與刀具接觸面先清潔；夾頭鑰匙使用完立即取下。</text>
<text x="60" y="653" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">伸出與夾持長度由工件、夾具和切削負荷決定，不把示意比例當作安全極限。</text>
