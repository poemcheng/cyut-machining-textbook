<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">車削的兩種運動</title><desc id="desc">旋轉提供切削速度；刀具的軸向與徑向移動決定形狀。</desc>
<rect width="1200" height="700" fill="white"/>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}</style>
<text x="40" y="49" font-size="34" fill="#163249" text-anchor="start" font-weight="bold">車削的兩種運動</text>
<text x="40" y="86" font-size="24" fill="#61788a" text-anchor="start" font-weight="normal">旋轉提供切削速度；刀具的軸向與徑向移動決定形狀。</text>
<line x1="40" y1="108" x2="1160" y2="108" stroke="#dbe3e9" stroke-width="2"/>
<rect x="180" y="225.0" width="100" height="190" rx="8" fill="#dbe3e9" stroke="#163249" stroke-width="3"/>
<rect x="272" y="235.0" width="20" height="37" rx="0" fill="#61788a" stroke="#163249" stroke-width="3"/>
<rect x="272" y="368.0" width="20" height="37" rx="0" fill="#61788a" stroke="#163249" stroke-width="3"/>
<line x1="155" y1="320" x2="660" y2="320" stroke="#61788a" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="280" y="270" width="595" height="100" rx="0" fill="#e9f4f5" stroke="#163249" stroke-width="3"/>
<ellipse cx="875" cy="320" rx="24" ry="50" fill="#e9f4f5" stroke="#163249" stroke-width="3"/>
<line x1="120" y1="320" x2="940" y2="320" stroke="#61788a" stroke-width="2" stroke-dasharray="10 8"/>
<path d="M205 230 C160 205 128 270 157 298" fill="none" stroke="#087f8c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon data-role="arrowhead" points="157.000,298.000 108.999,282.930 140.255,250.557" fill="#087f8c" stroke="none"/>
<text x="50" y="178" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">工件繞主軸旋轉</text>
<polygon points="730,370 760,413 850,413 850,388" fill="#ed8b3a" stroke="#163249" stroke-width="3" stroke-linejoin="round"/>
<line x1="850" y1="470" x2="560" y2="470" stroke="#087f8c" stroke-width="5"/>
<polygon data-role="arrowhead" points="560.000,470.000 605.000,447.500 605.000,492.500" fill="#087f8c" stroke="none"/>
<text x="560" y="515" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">軸向進給：沿主軸方向</text>
<line x1="962" y1="443" x2="962" y2="338" stroke="#ed8b3a" stroke-width="5"/>
<polygon data-role="arrowhead" points="962.000,338.000 984.500,383.000 939.500,383.000" fill="#ed8b3a" stroke="none"/>
<text x="880" y="190" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">徑向進給</text>
<text x="880" y="225" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">靠近／離開軸線</text>
<line x1="985" y1="245" x2="966" y2="336" stroke="#61788a" stroke-width="2"/>
<text x="590" y="345" font-size="24" fill="#61788a" text-anchor="middle" font-weight="normal">主軸中心線</text>
<text x="804" y="424" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">刀具</text>
<line x1="796" y1="416" x2="771" y2="390" stroke="#61788a" stroke-width="2"/>
<rect x="40" y="595" width="1120" height="68" rx="12" fill="#e9f4f5" stroke="none" stroke-width="3"/>
<text x="60" y="622" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">車外徑通常以軸向進給形成圓柱；車端面以徑向進給形成平面。</text>
<text x="60" y="653" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">直徑減少量 = 2 * 徑向切深；手輪刻度是直徑值或半徑值，須先核對。</text>
</svg>
