<text x="550" y="293" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">1</text>
<line x1="550" y1="335" x2="402.48138117806366" y2="343.80640794223825" stroke="#ed8b3a" stroke-width="3"/>
<circle cx="550" cy="335" r="19" fill="white" stroke="#ed8b3a" stroke-width="3"/>
<text x="550" y="343" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">2</text>
<line x1="570" y1="402" x2="405.5280974949221" y2="387.9738267148014" stroke="#ed8b3a" stroke-width="3"/>
<circle cx="570" cy="402" r="19" fill="white" stroke="#ed8b3a" stroke-width="3"/>
<text x="570" y="410" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">3</text>
<line x1="684" y1="463" x2="547.7081922816519" y2="404.7269855595668" stroke="#ed8b3a" stroke-width="3"/>
<circle cx="684" cy="463" r="19" fill="white" stroke="#ed8b3a" stroke-width="3"/>
<text x="684" y="471" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">4</text>
<line x1="553" y1="574" x2="390.8023019634394" y2="523.5221119133573" stroke="#ed8b3a" stroke-width="3"/>
<circle cx="553" cy="574" r="19" fill="white" stroke="#ed8b3a" stroke-width="3"/>
<text x="553" y="582" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">5</text>
<line x1="361" y1="495" x2="406.0358835477319" y2="498.1385379061372" stroke="#ed8b3a" stroke-width="3"/>
<circle cx="361" cy="495" r="19" fill="white" stroke="#ed8b3a" stroke-width="3"/>
<text x="361" y="503" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">6</text>
<circle cx="837" cy="156" r="18" fill="#e9f4f5" stroke="#087f8c" stroke-width="3"/>
<text x="837" y="164" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">1</text>
<text x="867" y="164" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">套筒（主軸外部）</text>
<circle cx="837" cy="224" r="18" fill="#e9f4f5" stroke="#087f8c" stroke-width="3"/>
<text x="837" y="232" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">2</text>
<text x="867" y="232" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">主軸／刀具固定處</text>
<circle cx="837" cy="292" r="18" fill="#e9f4f5" stroke="#087f8c" stroke-width="3"/>
<text x="837" y="300" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">3</text>
<text x="867" y="300" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">虎鉗</text>
<circle cx="837" cy="360" r="18" fill="#e9f4f5" stroke="#087f8c" stroke-width="3"/>
<text x="837" y="368" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">4</text>
<text x="867" y="368" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">工作台</text>
<circle cx="837" cy="428" r="18" fill="#e9f4f5" stroke="#087f8c" stroke-width="3"/>
<text x="837" y="436" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">5</text>
<text x="867" y="436" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">膝座</text>
<circle cx="837" cy="496" r="18" fill="#e9f4f5" stroke="#087f8c" stroke-width="3"/>
<text x="837" y="504" font-size="24" fill="#163249" text-anchor="middle" font-weight="bold">6</text>
<text x="867" y="504" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">可見手輪</text>
<rect x="40" y="706" width="1120" height="68" rx="12" fill="#e9f4f5" stroke="none" stroke-width="3"/>
<text x="60" y="733" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">照片上散放的工具並非可開機配置；啟動前先清空機台與工作台。</text>
<text x="60" y="764" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">操作程序仍須由現場教師核對；照片不能用來推定未知手柄功能。</text>
</svg>
