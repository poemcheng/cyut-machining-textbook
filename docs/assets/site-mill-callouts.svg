<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">實機照片導覽：立式膝式銑床</title><desc id="desc">使用者提供之現場照片；僅標註可見要素，未確認型號、手柄功能與設定。</desc>
<rect width="1200" height="790" fill="white"/>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}</style>
<text x="40" y="49" font-size="34" fill="#163249" text-anchor="start" font-weight="bold">實機照片導覽：立式膝式銑床</text>
<text x="40" y="86" font-size="24" fill="#61788a" text-anchor="start" font-weight="normal">使用者提供之現場照片；僅標註可見要素，未確認型號、手柄功能與設定。</text>
<line x1="40" y1="108" x2="1160" y2="108" stroke="#dbe3e9" stroke-width="2"/>
