<text x="139" y="576" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">保持垂直，避免斜量</text>
<text x="674" y="169" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">外徑分厘卡：更細的直徑判讀</text>
