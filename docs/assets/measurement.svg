<text x="1030" y="474" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">棘輪控測力</text>
<line x1="1080" y1="447" x2="1107" y2="401" stroke="#61788a" stroke-width="2"/>
<rect x="40" y="595" width="1120" height="68" rx="12" fill="#e9f4f5" stroke="none" stroke-width="3"/>
<text x="60" y="622" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">測量面避開毛邊與夾持傷痕；分厘卡用棘輪／摩擦套控制測力，勿用力旋緊。</text>
<text x="60" y="653" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">接觸面對齊並多點量測；圖是接觸概念，不表示卡尺可以代替精密公差檢驗。</text>
