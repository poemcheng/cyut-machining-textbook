<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">銑床基準：尋邊補半徑，Z 軸補量塊厚度</title><desc id="desc">先決定工件基準，再記錄顯示值；尋邊器與量塊都須使用核准方法。</desc>
<rect width="1200" height="700" fill="white"/>
<style>text{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}</style>
<text x="40" y="49" font-size="34" fill="#163249" text-anchor="start" font-weight="bold">銑床基準：尋邊補半徑，Z 軸補量塊厚度</text>
<text x="40" y="86" font-size="24" fill="#61788a" text-anchor="start" font-weight="normal">先決定工件基準，再記錄顯示值；尋邊器與量塊都須使用核准方法。</text>
<line x1="40" y1="108" x2="1160" y2="108" stroke="#dbe3e9" stroke-width="2"/>
<rect x="45" y="137" width="520" height="415" rx="12" fill="white" stroke="#dbe3e9" stroke-width="3"/>
<text x="67" y="179" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">X 基準：從左側尋邊</text>
<rect x="246" y="293" width="250" height="174" rx="0" fill="#e9f4f5" stroke="#163249" stroke-width="3"/>
<circle cx="216" cy="351" r="30" fill="#ed8b3a" stroke="#163249" stroke-width="3"/>
<rect x="207" y="244" width="18" height="77" rx="0" fill="#dbe3e9" stroke="#163249" stroke-width="3"/>
<line x1="216" y1="225" x2="216" y2="445" stroke="#61788a" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="246" y1="255" x2="246" y2="486" stroke="#087f8c" stroke-width="3" stroke-dasharray="8 6"/>
<text x="90" y="219" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">尋邊器中心</text>
<text x="317" y="278" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">真正邊界 X=0</text>
<line x1="216" y1="411" x2="246" y2="411" stroke="#61788a" stroke-width="2"/>
<polygon data-role="arrowhead" points="246.000,411.000 232.500,417.750 232.500,404.250" fill="#61788a" stroke="none"/>
<polygon data-role="arrowhead" points="216.000,411.000 229.500,404.250 229.500,417.750" fill="#61788a" stroke="none"/>
<text x="231.0" y="399" font-size="24" fill="#163249" text-anchor="middle" font-weight="normal">R</text>
<text x="80" y="519" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">接觸時中心：X = -R</text>
<rect x="615" y="137" width="540" height="415" rx="12" fill="white" stroke="#dbe3e9" stroke-width="3"/>
<text x="637" y="179" font-size="26" fill="#163249" text-anchor="start" font-weight="bold">Z 基準：停轉刀具接觸定厚量塊</text>
<rect x="765" y="217" width="85" height="61" rx="0" fill="#dbe3e9" stroke="#163249" stroke-width="3"/>
<rect x="791" y="278" width="33" height="68" rx="0" fill="#087f8c" stroke="#163249" stroke-width="3"/>
<rect x="773" y="346" width="74" height="55" rx="0" fill="#ed8b3a" stroke="#163249" stroke-width="3"/>
<rect x="685" y="401" width="340" height="76" rx="0" fill="#e9f4f5" stroke="#163249" stroke-width="3"/>
<line x1="679" y1="401" x2="1080" y2="401" stroke="#087f8c" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="926" y1="346" x2="926" y2="401" stroke="#61788a" stroke-width="2"/>
<polygon data-role="arrowhead" points="926.000,401.000 917.000,383.000 935.000,383.000" fill="#61788a" stroke="none"/>
<polygon data-role="arrowhead" points="926.000,346.000 935.000,364.000 917.000,364.000" fill="#61788a" stroke="none"/>
<text x="914" y="373.5" font-size="24" fill="#163249" text-anchor="end" font-weight="normal">h</text>
<text x="954" y="348" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">刀尖 Z=+h</text>
<text x="954" y="431" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">上表面 Z=0</text>
<text x="646" y="519" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">取出量塊後再加工；向下為負 Z</text>
<rect x="40" y="595" width="1120" height="68" rx="12" fill="#e9f4f5" stroke="none" stroke-width="3"/>
<text x="60" y="622" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">X/Y 尋邊要補尋邊器有效半徑；不把中心位置直接當作材料邊界。</text>
<text x="60" y="653" font-size="24" fill="#163249" text-anchor="start" font-weight="normal">Z 圖採刀具相對工件座標；刀具已停轉，禁止拿紙或手碰旋轉刀具。</text>
</svg>
